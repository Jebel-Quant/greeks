# No `plugins:` block here on purpose. docs/mkdocs-base.yml (inherited above)
# already declares `search` plus an mkdocstrings handler whose options were
# byte-for-byte identical to the copy that used to sit here. Keeping the
# duplicate meant two places to change and only one of them inherited by future
# template syncs; deleting it leaves the base as the single source of truth.
#
# The build environment, not this file, is what makes `::: greeks.black_scholes`
# in docs/api.md resolve — see MKDOCS_EXTRA_PACKAGES in .rhiza/.env.
