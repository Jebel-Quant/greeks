[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greeks"
version = "0.1.1"
description = "Option pricing and Greeks under the Black-Scholes model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com" }
]
dependencies = [
    "scipy>=1.17.0,<2",
    "numpy>=2.4.6,<3"
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/greeks"
Repository = "https://github.com/Jebel-Quant/greeks"

[dependency-groups]
# There is deliberately no `dev` group. It previously declared marimo, plotly,
# polars and pandas, none of which anything in this repo imports: there are no
# notebooks (MARIMO_FOLDER=docs/notebooks does not exist) and the library itself
# needs only numpy and scipy. `make marimo` and `make book` provision marimo via
# `uv run --with marimo`, never from the project environment, so the declarations
# bought nothing and pulled starlette, uvicorn, websockets, pyzmq and the rest of
# marimo's tree into uv.lock for every CI install and every dependabot run.
#
# Note `make deptry` cannot catch this: it scans SOURCE_FOLDER (src) only, so an
# unused *dev-group* dependency is outside its scope by construction.
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.165.9"
]
# ruff is deliberately absent: nothing resolves the *tool* from the project environment,
# since `make fmt` runs the ruff hooks through prek, which provisions each linter itself.
# The declaration only put a second, unused copy in uv.lock for renovate to bump.
#
# scipy-stubs is not a tool and must stay. Stubs are input to the analysis, so they have
# to be present in the environment mypy *inspects*, not the one it runs from — and
# `uv run --with mypy` in .rhiza/make.d/test.mk supplies only mypy. Without them
# `make typecheck` fails under --strict with 'Library stubs not installed for
# "scipy.stats"' on src/greeks/black_scholes.py. Note it would still pass locally:
# `make install` syncs with --inexact, which never prunes, so an already-installed copy
# lingers in .venv after it leaves uv.lock. Only a clean checkout (i.e. CI) sees it.
lint = [
    "scipy-stubs>=1.17.1.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/greeks"]

[tool.deptry]
# The dev/test/lint groups live under [dependency-groups] (PEP 735), which
# deptry already treats as development dependencies by default, so no
# dev-group configuration is needed here.

# bump-my-version auto-discovers exactly four filenames: .bumpversion.toml,
# .bumpversion.cfg, setup.cfg and pyproject.toml. This table previously lived in
# .rhiza/.cfg.toml, which is none of them, so it was never read — the tool fell
# back to `git describe` and reported the newest reachable tag as the current
# version, which is how a release gets cut at a version already published.
#
# There is deliberately no `current_version` and no [[tool.bumpversion.files]]
# entry for the version: bump-my-version reads and rewrites PEP 621
# [project].version natively, so the number lives in exactly one place and cannot
# drift.
[tool.bumpversion]
allow_dirty = false
# /rhiza:release commits and tags itself, so the changelog lands in the bump
# commit; letting bump-my-version do it too would add a second commit and a
# duplicate tag.
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "a",  # PEP 440 short form for alpha
    "beta",
    "b",  # PEP 440 short form for beta
    "rc",
    "prod",
]
