[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greeks"
version = "0.1.1"
description = "Option pricing and Greeks under the Black-Scholes model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Private :: Do Not Upload",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [
    { name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com" }
]
dependencies = [
    "scipy>=1.17.0,<2",
    "numpy>=2.4.6,<3"
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/greeks"
Repository = "https://github.com/Jebel-Quant/greeks"

[dependency-groups]
dev = [
    "marimo>=0.23.11",
    "plotly>=6.8.0",
    "polars>=1.42.1",
    "pandas>=3.0.3"
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.155.7"
]
lint = [
    "ruff>=0.15.20",
    "scipy-stubs>=1.17.1.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/greeks"]

[tool.deptry]
# The dev/test/lint groups live under [dependency-groups] (PEP 735), which
# deptry already treats as development dependencies by default, so no
# dev-group configuration is needed here.
