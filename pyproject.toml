[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greeks"
version = "0.1.1"
description = "Option pricing and Greeks under the Black-Scholes model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" }
]
dependencies = [
    "scipy>=1.17.0,<2",
    "numpy>=2.4.6,<3"
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/greeks"
Repository = "https://github.com/Jebel-Quant/greeks"

[dependency-groups]
# There is deliberately no `dev` group. It previously declared marimo, plotly,
# polars and pandas, none of which anything in this repo imports: there are no
# notebooks (MARIMO_FOLDER=docs/notebooks does not exist) and the library itself
# needs only numpy and scipy. `make marimo` and `make book` provision marimo via
# `uv run --with marimo`, never from the project environment, so the declarations
# bought nothing and pulled starlette, uvicorn, websockets, pyzmq and the rest of
# marimo's tree into uv.lock for every CI install and every dependabot run.
#
# Note `make deptry` cannot catch this: it scans SOURCE_FOLDER (src) only, so an
# unused *dev-group* dependency is outside its scope by construction.
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.165.9"
]
# ruff is deliberately absent: nothing resolves the *tool* from the project environment,
# since `make fmt` runs the ruff hooks through prek, which provisions each linter itself.
# The declaration only put a second, unused copy in uv.lock for renovate to bump.
#
# scipy-stubs is not a tool and must stay. Stubs are input to the analysis, so they have
# to be present in the environment mypy *inspects*, not the one it runs from — and
# `uv run --with mypy` in .rhiza/make.d/test.mk supplies only mypy. Without them
# `make typecheck` fails under --strict with 'Library stubs not installed for
# "scipy.stats"' on src/greeks/black_scholes.py. Note it would still pass locally:
# `make install` syncs with --inexact, which never prunes, so an already-installed copy
# lingers in .venv after it leaves uv.lock. Only a clean checkout (i.e. CI) sees it.
lint = [
    "scipy-stubs>=1.17.1.5"
]

[tool.hatch.build.targets.wheel]
packages = ["src/greeks"]

[tool.rhiza-task]
# Settings for the task runner that replaced the synced make layer in rhiza v1.4.0 --
# `.rhiza/rhiza.mk`, the ten fragments under `.rhiza/make.d/`, and the root `Makefile`,
# all deleted by the v1.4.2 sync. Read as layer 3 of rhiza-task's resolution order
# (defaults -> .rhiza/.env -> pyproject.toml -> RHIZA_* environment). Only entries that
# differ from the CLI's defaults belong here; `uvx rhiza-task print <setting>` shows what
# one resolves to.

# `.rhiza/make.d/custom-env.mk` set `COVERAGE_FAIL_UNDER := 100`, raising the make layer's
# default of 90. The `test` task passes --cov-fail-under on the command line, and this repo
# has no [tool.coverage.report] table to state the number anywhere else, so leaving it unset
# would have quietly dropped the gate to 90 with nothing in the tree saying otherwise.
coverage-fail-under = 100

# The retired python.mk had `TYPECHECKER ?= both`; the CLI defaults to `ty` alone, so a bare
# migration would have dropped `mypy --strict` from this repo's typecheck gate -- the one the
# `scipy-stubs` entry in the `lint` group above exists to serve. `both` is also stricter here
# than it was under make: the shell `case` let mypy's exit status win, so a ty failure could
# pass, where the CLI raises on each run.
typechecker = "both"

# The retired quality.mk pinned `RHIZA_CHECKS_VERSION ?= 0.2.1` and installed
# `pytest-rhiza==$(RHIZA_CHECKS_VERSION)` from PyPI. The CLI's default names a git tag at
# v0.2.0, so a bare migration would have *downgraded* the conformance checks -- the drift the
# pin exists to prevent. Pinned exactly rather than floored: a gate that moves under you is
# not a gate. 0.2.2 is out; bumping to it is a separate upgrade decision.
pytest-rhiza = "pytest-rhiza==0.2.1"

# The deleted `Makefile` carried `MKDOCS_EXTRA_PACKAGES = --with . --with 'mkdocstrings[python]'`,
# and each entry here becomes one `--with` on the `uvx zensical build` invocation. Both are
# load-bearing for `book`: docs/api.md uses a `::: greeks.black_scholes` directive, and zensical
# runs in an isolated environment where neither this project nor mkdocstrings is importable --
# without them the build fails with "Could not collect 'greeks.black_scholes'" or "mkdocstrings
# plugin is enabled, but mkdocstrings is not installed". mkdocstrings[python] is the CLI default,
# but naming the setting at all replaces the default list, so it has to be repeated alongside `.`.
mkdocs-extra-packages = ["mkdocstrings[python]", "."]

# Not set, on purpose:
#   source-folder     -- the default `src` is already this repo's layout, which is all the
#                        deleted `.rhiza/.env` said with SOURCE_FOLDER=src.
#   marimo-folder     -- the default `docs/notebooks` is what `.rhiza/.env` set, and the folder
#                        does not exist here: there are no notebooks (see [dependency-groups]).
#   ci-os-matrix      -- `.rhiza/.env` deliberately left it unset so `rhiza_ci.yml` picks the
#                        matrix per caller; the default is ubuntu-latest alone, and this package
#                        is pure numpy/scipy arithmetic with no paths and no servers.
#   layers            -- `python` is detected from pyproject.toml.

[tool.deptry]
# The dev/test/lint groups live under [dependency-groups] (PEP 735), which
# deptry already treats as development dependencies by default, so no
# dev-group configuration is needed here.

# bump-my-version auto-discovers exactly four filenames: .bumpversion.toml,
# .bumpversion.cfg, setup.cfg and pyproject.toml. This table previously lived in
# .rhiza/.cfg.toml, which is none of them, so it was never read — the tool fell
# back to `git describe` and reported the newest reachable tag as the current
# version, which is how a release gets cut at a version already published.
#
# There is deliberately no `current_version` and no [[tool.bumpversion.files]]
# entry for the version: bump-my-version reads and rewrites PEP 621
# [project].version natively, so the number lives in exactly one place and cannot
# drift.
[tool.bumpversion]
allow_dirty = false
# /rhiza:release commits and tags itself, so the changelog lands in the bump
# commit; letting bump-my-version do it too would add a second commit and a
# duplicate tag.
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "a",  # PEP 440 short form for alpha
    "beta",
    "b",  # PEP 440 short form for beta
    "rc",
    "prod",
]
