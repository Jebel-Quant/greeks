[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greeks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com" }
]
dependencies = [
    "scipy>=1.17.0",
    "numpy>=2.4.6"
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/greeks"
Repository = "https://github.com/Jebel-Quant/greeks"

[dependency-groups]
dev = [
    "marimo>=0.23.8",
    "plotly>=6.7.0",
    "polars>=1.41.0",
    "pandas>=3.0.3"
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0"
]
lint = [
    "ruff>=0.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/greeks"]

[tool.deptry]
# see https://deptry.com/usage/#pep-621-dev-dependency-groups
pep621_dev_dependency_groups = ["dev"]
